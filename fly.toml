app = "canada-immigration-dashboard"  # Customize this to your app name

primary_region = "sea"

[build]

[env]
PORT = "8050"
PYTHONUNBUFFERED = "1"

[[services]]
internal_port = 8050
protocol = "tcp"

  [[services.ports]]
  port = 80
  handlers = ["http"]

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  [[services.tcp_checks]]
  port = 8050
  interval = "15s"
  timeout = "2s"
  grace_period = "30s"
  restart_limit = 0
