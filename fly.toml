app = 'immigration-stats'
primary_region = 'sea'

[build]

[http_service]
  internal_port = 8050
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '8gb'
  cpu_kind = 'shared'
  cpus = 4
